# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # Most runs take 2 to 5 minutes. With cold caches, setup-r and
    # setup-r-dependencies have taken up to 14 minutes on Ubuntu release and
    # oldrel and 32 minutes on devel, which builds packages from source.
    timeout-minutes: ${{ matrix.config.timeout }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', timeout: 30}
          - {os: windows-latest, r: 'release', timeout: 30}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release', timeout: 60}
          - {os: ubuntu-latest,   r: 'release', timeout: 30}
          - {os: ubuntu-latest,   r: 'oldrel-1', timeout: 30}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
